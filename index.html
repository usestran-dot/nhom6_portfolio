<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Developer Room</title>
    <link rel="stylesheet" href="./styles.css"> </head>
<body>
    <div id="loading-screen">
      <div class="loader-container">
        <h1 class="loader-title">DEVELOPER ROOM</h1>
        <div class="progress-bar-container">
          <div id="progress-bar"></div>
        </div>
        <p id="progress-text">Loading... 0%</p>
      </div>
    </div>

    <div id="blocker">
        <div id="instructions">
            <p style="font-size:36px; font-weight: bold; margin-bottom: 10px;">CLICK ĐỂ BƯỚC VÀO PHÒNG</p>
            <p>(W, A, S, D = Di chuyển | Chuột = Xoay góc nhìn)</p>
        </div>
    </div>

    <div id="crosshair"></div>

    <script type="module" src="./main.js"></script>
</body>
</html>
