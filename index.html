<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Room Portfolio | UET CTE2059</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loader-container">
            <h1 class="loader-title">DEVELOPER ROOM</h1>
            
            <div id="loading-progress">
                <div class="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
                <p id="progress-text">Loading... 0%</p>
            </div>

            <div id="start-container" style="display: none;">
                <p class="invite-text">Khám phá căn phòng 3D của tôi — nhấn Start để bắt đầu hành trình</p>
                <button id="start-btn">START</button>
            </div>
        </div>
    </div>

    <div id="audio-control" class="audio-control">
        <button id="mute-btn" title="Bật/Tắt Nhạc">🔊</button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.3" title="Chỉnh âm lượng">
    </div>

    <div id="blocker">
        <div id="instructions">
            <p style="font-size:36px; font-weight: bold; margin-bottom: 10px;">CLICK ĐỂ BƯỚC VÀO PHÒNG</p>
            <p>(W, A, S, D = Di chuyển | Chuột = Xoay góc nhìn)</p>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="zoom-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000; justify-content:center; align-items:center; cursor:zoom-out;">
        <img id="zoomed-image" src="" style="max-width:90%; max-height:90vh; border:2px solid #00ffcc; box-shadow: 0 0 30px rgba(0,255,204,0.3);">
        <div style="position:absolute; top:20px; right:30px; color:white; font-size:40px;">&times;</div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
